services:
  kv:
    build: .
    image: tiny-kv
    container_name: tiny-kv
    ports:
      - "8000:8000"
    healthcheck:
      # the slim base image has no curl; python + httpx (already a dependency)
      # is the reliable in-container probe. Exits 0 when /health says ok.
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
